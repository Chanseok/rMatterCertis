name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  rust-tests:
    name: Rust tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Run cargo test
        working-directory: src-tauri
        run: cargo test --all -q

  ts-typecheck:
    name: TypeScript type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install deps
        run: npm ci
      - name: Generate TS bindings
        run: bash scripts/generate_types.sh
      - name: Type-check
        run: npm run -s type-check
      - name: URL slot/id consistency check
        # TODO: This check should be blocking once stabilized.
        continue-on-error: true
        run: bash scripts/check_url_slot_id_consistency.sh

  # parity-compare job removed with legacy BatchActor retirement
