name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      platform:
        description: 'Platform to build'
        required: true
        type: choice
        options:
          - 'both'
          - 'macos'
          - 'windows'
        default: 'both'

jobs:
  preflight-macos:
    name: Preflight Validation (macOS)
    runs-on: macos-latest
    if: >-
      github.event_name == 'push' ||
      github.event.inputs.platform == 'both' ||
      github.event.inputs.platform == 'macos'
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: 'aarch64-apple-darwin,x86_64-apple-darwin'

      - name: Install dependencies (macOS)
        run: |
          rustup target add aarch64-apple-darwin
          rustup target add x86_64-apple-darwin

      - name: Verify package.json
        run: |
          echo "=== Checking package.json ==="
          node -e "const pkg = require('./package.json'); console.log('Version:', pkg.version); if (!pkg.version || !/^\d+\.\d+\.\d+/.test(pkg.version)) { console.error('Invalid version!'); process.exit(1); }"
          
      - name: Install frontend dependencies
        run: |
          rm -rf package-lock.json node_modules
          npm install --legacy-peer-deps
          echo "✅ npm install successful"

      - name: Quick Rust compilation check
        run: |
          echo "=== Running cargo check (compilation validation only) ==="
          cargo check --manifest-path src-tauri/Cargo.toml --release
          echo "✅ Cargo check passed"
      
      - name: Lint check
        run: |
          echo "=== Running cargo clippy ==="
          cargo clippy --manifest-path src-tauri/Cargo.toml -- -D warnings || echo "⚠️ Clippy warnings found but continuing"
          echo "✅ Lint check complete"

      - name: Frontend build test
        run: |
          echo "=== Testing frontend build ==="
          npm run build
          echo "✅ Frontend build successful"

  preflight-windows:
    name: Preflight Validation (Windows)
    runs-on: windows-latest
    if: >-
      github.event_name == 'push' ||
      github.event.inputs.platform == 'both' ||
      github.event.inputs.platform == 'windows'
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Verify package.json
        run: |
          echo "=== Checking package.json ==="
          node -e "const pkg = require('./package.json'); console.log('Version:', pkg.version); if (!pkg.version || !/^\d+\.\d+\.\d+/.test(pkg.version)) { console.error('Invalid version!'); process.exit(1); }"
          
      - name: Install frontend dependencies
        run: |
          if (Test-Path package-lock.json) { Remove-Item package-lock.json }
          if (Test-Path node_modules) { Remove-Item -Recurse -Force node_modules }
          npm install --legacy-peer-deps
          echo "✅ npm install successful"

      - name: Quick Rust compilation check
        run: |
          echo "=== Running cargo check (compilation validation only) ==="
          cargo check --manifest-path src-tauri/Cargo.toml --release
          echo "✅ Cargo check passed"
      
      - name: Lint check
        run: |
          echo "=== Running cargo clippy ==="
          cargo clippy --manifest-path src-tauri/Cargo.toml -- -D warnings || echo "⚠️ Clippy warnings found but continuing"
          echo "✅ Lint check complete"

      - name: Frontend build test
        run: |
          echo "=== Testing frontend build ==="
          npm run build
          echo "✅ Frontend build successful"

  release-macos:
    name: Release Build (macOS)
    needs: preflight-macos
    runs-on: macos-latest
    if: >-
      github.event_name == 'push' ||
      github.event.inputs.platform == 'both' ||
      github.event.inputs.platform == 'macos'
    permissions:
      contents: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: 'aarch64-apple-darwin,x86_64-apple-darwin'

      - name: Install dependencies (macOS)
        run: |
          rustup target add aarch64-apple-darwin
          rustup target add x86_64-apple-darwin
          
      - name: Install frontend dependencies
        run: |
          rm -rf package-lock.json node_modules
          npm install --legacy-peer-deps

      - name: Build and Bundle the app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CARGO_TARGET_AARCH64_APPLE_DARWIN_LINKER: clang
          CARGO_TARGET_X86_64_APPLE_DARWIN_LINKER: clang
        with:
          tagName: ${{ github.ref_name }}
          releaseName: rMatterCertis v__VERSION__
          releaseBody: See assets below for platform-specific installers. Download the .dmg for macOS or .msi for Windows.
          releaseDraft: true
          prerelease: false
          args: --target universal-apple-darwin

  release-windows:
    name: Release Build (Windows)
    needs: preflight-windows
    runs-on: windows-latest
    if: >-
      github.event_name == 'push' ||
      github.event.inputs.platform == 'both' ||
      github.event.inputs.platform == 'windows'
    permissions:
      contents: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
          
      - name: Install frontend dependencies
        run: |
          if (Test-Path package-lock.json) { Remove-Item package-lock.json }
          if (Test-Path node_modules) { Remove-Item -Recurse -Force node_modules }
          npm install --legacy-peer-deps

      - name: Build and Bundle the app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: rMatterCertis v__VERSION__
          releaseBody: See assets below for platform-specific installers. Download the .dmg for macOS or .msi for Windows.
          releaseDraft: true
          prerelease: false
